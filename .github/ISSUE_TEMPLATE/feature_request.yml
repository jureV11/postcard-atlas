name: Feature idea
description: Suggest something new or a change to something that exists
labels: [idea]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: Describe the idea. A rough sketch or screenshot is welcome.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it be nice?
      description: What would it make easier, or more fun?
    validations:
      required: false
