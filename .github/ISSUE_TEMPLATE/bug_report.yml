name: Bug report
description: Something's broken or not working as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What went wrong, and what did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen
      placeholder: |
        1. Open the map
        2. Tap on …
        3. See error
    validations:
      required: false
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: iPhone 15, Safari / Windows, Firefox
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag images in here. Please blur out anything private (names, addresses, postcard photos).
    validations:
      required: false
