# Postcard Atlas
#
#   docker compose --env-file .env.local up --build -d    (settings in .env.local)
#   docker compose up --build -d                          (settings in .env)
#
# Settings come from .env.local or .env next to this file, whichever you have.
# Optional: HOST_PORT=3020 in that file to serve on another port.
# Then open http://localhost:3000 (or your HOST_PORT). The database, sign-in and
# photo storage stay on Supabase.

services:
  web:
    build:
      context: .
      args:
        # Baked into the browser code at build time
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?Missing — run with --env-file .env.local, or put your settings in .env}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?Missing — run with --env-file .env.local, or put your settings in .env}
    image: postcard-atlas:latest
    container_name: postcard-atlas
    env_file:
      - path: .env.local
        required: false
      - path: .env
        required: false
    ports:
      - "${HOST_PORT:-3000}:3000"
    restart: unless-stopped
